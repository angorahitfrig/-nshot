name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'icons/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Optional: add repository secrets NSHOT_KEYSTORE_BASE64 and NSHOT_KEYSTORE_PASSWORD
      # to sign with your own key, so new APKs install over old ones.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NSHOT_KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nshot.jks"
          echo "NSHOT_KEYSTORE=$RUNNER_TEMP/nshot.jks" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        env:
          NSHOT_KEYSTORE_PASSWORD: ${{ secrets.NSHOT_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk nShot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nShot-apk
          path: nShot.apk
